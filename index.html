</style></head><body><div class="app"><header class="top"><div><div class="subtitle">Wasza książka posiłków</div><div class="logo">foodbok <span class="heart">♡</span></div></div><div style="font-size:35px">🍓</div></header><div class="tabs" id="people"></div><div class="nav" id="nav"></div><section class="syncbar" id="cloudPanel"></section><main id="content"></main><footer class="footer">foodbok ♡ • Kalorie synchronizują się po połączeniu z kontem rodzinnym</footer></div><div id="modalroot"></div><script>
const baseRecipes=[
{id:'oats',cat:'Śniadania',name:'Owsianka z borówkami',photo:'oats',desc:'Ciepła owsianka z mlekiem migdałowym, agawą i borówkami.',ing:[['Płatki owsiane suche',50,50,'g'],['Mleko migdałowe',150,150,'ml'],['Syrop z agawy',5,5,'g'],['Borówki',80,80,'g']],macro:[[266,8,45,5],[266,8,45,5]]},
{id:'pasta_chicken',cat:'Lunch',name:'Makaron z kurczakiem, pomidorkami i rukolą',photo:'pasta_chicken',desc:'Lekki makaron z kurczakiem i świeżą rukolą.',ing:[['Makaron suchy',50,50,'g'],['Pierś kurczaka',160,140,'g'],['Pomidorki',120,120,'g'],['Rukola',40,40,'g'],['Oliwa',5,5,'g']],macro:[[433,46,43,10],[411,41,43,9]]},
{id:'pasta_tuna',cat:'Lunch',name:'Makaron z tuńczykiem, groszkiem i ketchupem',photo:'pasta_tuna',desc:'Wersja po korekcie gramatury tuńczyka.',ing:[['Makaron suchy',50,50,'g'],['Tuńczyk w oliwie, odsączony',100,90,'g'],['Groszek zielony',60,60,'g'],['Ketchup',30,30,'g']],macro:[[450,36,52,10],[430,33,52,9]]},
{id:'salmon',cat:'Obiad',name:'Łosoś, batat i brokuł',photo:'salmon',desc:'Łosoś z airfryera, pieczony batat i brokuł.',ing:[['Łosoś świeży',180,180,'g'],['Batat',180,140,'g'],['Brokuł',150,150,'g'],['Oliwa',5,5,'g']],macro:[[625,43,46,29],[591,42,38,29]]},
{id:'beef',cat:'Obiad',name:'Ryż, wołowina i warzywa z patelni',photo:'beef',desc:'Chuda wołowina, ryż i warzywa bez sosu.',ing:[['Wołowina mielona 5% tłuszczu',190,190,'g'],['Ryż biały suchy',65,50,'g'],['Mieszanka warzyw bez sosu',200,200,'g'],['Oliwa',5,5,'g']],macro:[[619,48,65,17],[565,47,54,17]]},
{id:'chicken',cat:'Obiad',name:'Kurczak, puree i surówka jabłkowa',photo:'chicken',desc:'Pierś z kurczaka, ziemniaki z masłem i marchewka z jabłkiem.',ing:[['Pierś kurczaka',180,180,'g'],['Ziemniaki',250,200,'g'],['Masło 82%',10,10,'g'],['Marchew',100,100,'g'],['Jabłko',80,60,'g']],macro:[[548,48,64,12],[499,47,53,11]]},
{id:'yogurt',cat:'Kolacja',name:'Jogurt proteinowy z borówkami i orzechami',photo:'yogurt',desc:'Jogurt grecki 0%, borówki, orzechy i odżywka białkowa.',ing:[['Jogurt grecki 0%',150,150,'g'],['Borówki',80,80,'g'],['Orzechy włoskie',10,10,'g'],['Odżywka białkowa',1,1,'miarka']],macro:[[304,41,20,9],[304,41,20,9]]},
{id:'shake',cat:'Kolacja',name:'Shake bananowo-orzechowy',photo:'shake',desc:'Kolacja mamy z bananem i masłem orzechowym.',ing:[['Banan',50,50,'g'],['Masło orzechowe 100%',10,10,'g'],['Odżywka białkowa',1,1,'miarka'],['Mleko bez laktozy (43 kcal/100 ml)',150,150,'ml']],macro:[[272,31,23,8],[272,31,23,8]]},
{id:'green',cat:'Smoothie',name:'Zielone smoothie',photo:'green',desc:'Jarmuż, banan, szpinak i woda. Wartości orientacyjne.',ing:[['Jarmuż',20,20,'g'],['Banan',50,50,'g'],['Szpinak',20,20,'g'],['Woda',0,0,'do smaku']],macro:[[85,2,15,.5],[85,2,15,.5]]}
];
const cats=['Składniki','Śniadania','Lunch','Obiad','Kolacja','Smoothie'];const slots=['Śniadania','Lunch','Obiad','Smoothie','Kolacja'];const lbl={'Śniadania':'Śniadanie','Lunch':'Lunch','Obiad':'Obiad','Smoothie':'Smoothie','Kolacja':'Kolacja'};
const get=(key,fallback)=>{try{let d=JSON.parse(localStorage.getItem(key));return d??fallback}catch{return fallback}};const save=(key,v)=>localStorage.setItem(key,JSON.stringify(v));
let person=get('fb_person',0),view='today',date=get('fb_date',new Date().toLocaleDateString('en-CA')),plans=get('fb_plans',{}),extras=get('fb_extra',[]),shopConfig=get('fb_shop',{days:3,people:[true,true],selected:baseRecipes.map(r=>r.id)}),shopChecked=get('fb_shopchecked',{});let modal=null;
const recipes=()=>[...baseRecipes,...extras];const byId=id=>recipes().find(r=>r.id===id);const standard={Śniadania:'oats',Lunch:'pasta_chicken',Obiad:'salmon',Smoothie:'green',Kolacja:['yogurt','shake']};
const dk=(day,p)=>day+'_'+p;function plan(day=date,p=person){let key=dk(day,p);if(!plans[key]){plans[key]={select:{Śniadania:'oats',Lunch:'pasta_chicken',Obiad:'salmon',Smoothie:'green',Kolacja:p===0?'yogurt':'shake'},eaten:{Śniadania:false,Lunch:false,Obiad:false,Smoothie:false,Kolacja:false}}}return plans[key]};function persist(){save('fb_plans',plans);window.foodbokCloudChanged?.()};const fmt=n=>Number.isInteger(n)?n.toString():n.toFixed(1).replace('.',',');const picture=r=>r.photo?`<img loading="lazy" src="images/${r.photo}.webp" alt="${esc(r.name)}">`:`<div class="placeholder">🍽️</div>`;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dateAdd=(d,days)=>{let v=new Date(d+'T12:00:00');v.setDate(v.getDate()+days);return v.toLocaleDateString('en-CA')};
function render(){document.getElementById('people').innerHTML=['Klara','Mama'].map((name,i)=>`<button class="${person===i?'active':''}" onclick="setPerson(${i})">${i?'🌷':'💗'} ${name} · ${foodbokGoal(date,i)} kcal</button>`).join('');document.getElementById('nav').innerHTML=[['today','📅 Dziś'],['recipes','📖 Przepisy'],['shop','🛒 Zakupy']].map(([v,name])=>`<button class="${view===v?'active':''}" onclick="setView('${v}')">${name}</button>`).join('');document.getElementById('content').innerHTML=view==='today'?todayView():view==='recipes'?recipesView():shopView();if(modal)renderModal()}
function setPerson(i){person=i;save('fb_person',i);render()}function setView(v){view=v;render();window.scrollTo({top:0,behavior:'smooth'})};function setDate(v){if(!v)return;date=v;save('fb_date',v);render()}function offsetDate(n){setDate(dateAdd(date,n))}
function totals(){let p=plan();let t=[0,0,0,0];slots.forEach(s=>{if(p.eaten[s]){let r=byId(p.select[s]);if(r)r.macro[person].forEach((v,i)=>t[i]+=Number(v)||0)}});return t}
function todayView(){let target=foodbokGoal(date,person),vals=totals(),p=plan(),percent=Math.round(vals[0]/target*100);return `<section class="card hero"><div class="label">Dzienny bilans · ${person?'Mama':'Klara'}</div><div class="big">${fmt(vals[0])} <span class="muted" style="font-size:18px">/ ${target} kcal</span></div><div class="${vals[0]>target?'':'muted'}" style="font-size:13px">${vals[0]>target?`${fmt(vals[0]-target)} kcal ponad cel`:`Pozostało ${fmt(target-vals[0])} kcal`}</div><div class="meter"><span style="width:${Math.min(100,percent)}%"></span></div><div class="metrics">${['Białko','Węglowodany','Tłuszcze'].map((n,i)=>`<div class="metric"><strong>${fmt(vals[i+1])} g</strong><small>${n}</small></div>`).join('')}</div><p class="hint">Do bilansu wliczają się wyłącznie zaznaczone jako zjedzone posiłki. Makro z przesłanych screenów jest orientacyjne.</p></section><section class="card"><div class="datebar"><button class="iconbtn" onclick="offsetDate(-1)">‹</button><label class="field">Wybierz dzień<input type="date" value="${date}" onchange="setDate(this.value)"></label><button class="iconbtn" onclick="offsetDate(1)">›</button></div><h2 class="section-title">Twój jadłospis 🍽️</h2><div class="split" style="justify-content:space-between"><span class="hint">Zaznacz zjedzone posiłki</span><button class="smallbtn" onclick="markAll()">Zaznacz wszystkie</button></div>${slots.map(s=>{let r=byId(p.select[s]);if(!r)return '';let m=r.macro[person];return `<div class="meal"><input aria-label="Zjedzono: ${esc(s)}" type="checkbox" ${p.eaten[s]?'checked':''} onchange="toggleEaten('${s}',this.checked)"><div><div class="meal-name">${lbl[s]}</div><div class="meal-desc">${esc(r.name)}</div><button class="smallbtn" onclick="chooseSlot('${s}')">${s==='Lunch'||s==='Obiad'?'Zmień posiłek':'Wybierz inny'}</button></div><div class="meal-right"><b>${fmt(m[0])} kcal</b><div class="mini">B ${fmt(m[1])} · W ${fmt(m[2])} · T ${fmt(m[3])}</div></div></div>`}).join('')}<button class="secondary full" onclick="copyDay()" style="margin-top:15px">📋 Kopiuj dzienny jadłospis</button></section><div class="notice">Śniadanie, smoothie i kolacja mają ustawione Wasze stałe propozycje. Lunche i obiady możesz wymieniać każdego dnia. Wszystkie wybory zapisują się osobno dla Klary i mamy.</div>`}
function toggleEaten(s,yes){plan().eaten[s]=yes;persist();render()}function markAll(){slots.forEach(s=>plan().eaten[s]=true);persist();render()}function setMeal(s,id){plan().select[s]=id;plan().eaten[s]=false;persist();modal=null;render()}function copyDay(){let p=plan();let text=`FOODBOK — ${person?'Mama':'Klara'} — ${date}\n`+slots.map(s=>`${lbl[s]}: ${byId(p.select[s])?.name||'-'} ${p.eaten[s]?'✓':''}`).join('\n')+`\nBilans: ${totals().join(' / ')} (kcal / B / W / T)`;navigator.clipboard?.writeText(text).then(()=>alert('Skopiowano jadłospis')).catch(()=>prompt('Skopiuj:',text))}
function recipesView(){return `<h2 class="section-title">Wasza baza przepisów ♡</h2><p class="muted" style="font-size:14px">Otwórz kategorię, by zobaczyć posiłki, gramatury i makro. Możesz też dopisać własny przepis.</p><button class="primary full" onclick="showAdd()">＋ Dodaj nowy posiłek</button>${cats.map(cat=>cat==='Składniki'?`<details class="category"><summary>🧺 Składniki</summary><div style="padding:0 17px 16px" class="hint">Produkty i gramatury znajdziesz w szczegółach każdego przepisu. Lista zakupów automatycznie sumuje powtarzające się składniki.</div></details>`:`<details class="category" ${cat==='Śniadania'?'open':''}><summary>${({Śniadania:'🫐',Lunch:'🍝',Obiad:'🍽️',Kolacja:'🌙',Smoothie:'🥤'})[cat]} ${cat} <span class="mini">${recipes().filter(r=>r.cat===cat).length}</span></summary>${recipes().filter(r=>r.cat===cat).map(r=>`<div class="recipe">${picture(r)}<div class="recipe-body"><h3>${esc(r.name)}</h3><p>${esc(r.desc)}</p><span class="pill">${fmt(r.macro[person][0])} kcal</span><span class="pill">B ${fmt(r.macro[person][1])} · W ${fmt(r.macro[person][2])} · T ${fmt(r.macro[person][3])}</span><br><button class="smallbtn" onclick="details('${r.id}')">Zobacz przepis</button></div></div>`).join('')}</details>`).join('')}`}
function shopView(){let selected=shopConfig.selected;let sums={};for(const r of recipes().filter(r=>selected.includes(r.id))){for(const [name,a,b,unit] of r.ing){let total=(shopConfig.people[0]?Number(a):0)+(shopConfig.people[1]?Number(b):0);if(!total)continue;let key=name.toLowerCase()+'|'+unit;if(!sums[key])sums[key]={name,unit,total:0};sums[key].total+=total*shopConfig.days}}let entries=Object.values(sums).sort((a,b)=>a.name.localeCompare(b.name,'pl'));return `<h2 class="section-title">Lista zakupów 🛒</h2><div class="card"><div class="label">Zaplanuj zakupy na 1–7 dni</div><div class="field" style="margin-top:14px">Liczba dni<select onchange="setShopDays(this.value)">${[1,2,3,4,5,6,7].map(n=>`<option value="${n}" ${shopConfig.days===n?'selected':''}>${n} ${n===1?'dzień':n<5?'dni':'dni'}</option>`).join('')}</select></div><p class="label" style="margin-top:20px">Dla kogo kupujemy?</p><div class="split">${['Klara','Mama'].map((name,i)=>`<label class="shoprow" style="border:0"><input type="checkbox" ${shopConfig.people[i]?'checked':''} onchange="setShopPerson(${i},this.checked)">${name}</label>`).join('')}</div><p class="label" style="margin-top:20px">Zaznacz przepisy</p>${['Śniadania','Lunch','Obiad','Smoothie','Kolacja'].map(cat=>`<h4 class="shophead">${cat}</h4>${recipes().filter(r=>r.cat===cat).map(r=>`<label class="shoprow"><input type="checkbox" ${selected.includes(r.id)?'checked':''} onchange="toggleShopRecipe('${r.id}',this.checked)"><span>${esc(r.name)}</span></label>`).join('')}`).join('')}</div><div class="card"><h2 style="margin-top:0">Twoje zakupy 💗</h2><p class="hint">Ilości dla ${shopConfig.days} dni, na podstawie zaznaczonych przepisów i osób. Każdy zaznaczony przepis liczony jest raz dziennie.</p>${entries.length?entries.map(r=>`<label class="shoprow"><input type="checkbox" ${shopChecked[r.name]?'checked':''} onchange="checkShop('${esc(r.name)}',this.checked)"><span style="${shopChecked[r.name]?'text-decoration:line-through;opacity:.5':''}">${esc(r.name)}</span><b>${fmt(r.total)} ${esc(r.unit)}</b></label>`).join(''):'<div class="empty">Zaznacz przepisy i osoby, by utworzyć listę.</div>'}<button class="primary full" style="margin-top:16px" onclick="copyShop()">📋 Kopiuj listę zakupów</button><button class="secondary full" style="margin-top:8px" onclick="shopChecked={};save('fb_shopchecked',shopChecked);render()">Odznacz kupione produkty</button></div><div class="notice">Przykład: jeśli zaznaczysz dwa różne obiady na 3 dni, aplikacja policzy składniki obu obiadów × 3. Jeśli chcesz rozpisać różne dania na różne dni, wybieraj przepisy odpowiednio do planu lub korzystaj z dziennego jadłospisu.</div>`}
function setShopDays(n){shopConfig.days=Number(n);save('fb_shop',shopConfig);render()}function setShopPerson(i,b){shopConfig.people[i]=b;save('fb_shop',shopConfig);render()}function toggleShopRecipe(id,b){shopConfig.selected=b?[...new Set([...shopConfig.selected,id])]:shopConfig.selected.filter(x=>x!==id);save('fb_shop',shopConfig);render()}function checkShop(name,b){shopChecked[name]=b;save('fb_shopchecked',shopChecked);render()}function copyShop(){let entries={};recipes().filter(r=>shopConfig.selected.includes(r.id)).forEach(r=>r.ing.forEach(([name,a,b,unit])=>{let q=(shopConfig.people[0]?Number(a):0)+(shopConfig.people[1]?Number(b):0);if(!q)return;let key=name+'|'+unit;entries[key]=(entries[key]||0)+q*shopConfig.days}));let out=`FOODBOK — lista zakupów na ${shopConfig.days} dni\n`+Object.entries(entries).map(([k,v])=>`☐ ${k.split('|')[0]}: ${fmt(v)} ${k.split('|')[1]}`).join('\n');navigator.clipboard?.writeText(out).then(()=>alert('Skopiowano listę zakupów')).catch(()=>prompt('Skopiuj listę:',out))}
function showModal(body){modal=body;renderModal()}function closeModal(){modal=null;document.getElementById('modalroot').innerHTML=''}function renderModal(){document.getElementById('modalroot').innerHTML=modal?`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modal-panel"><div class="modal-head"><h2 style="margin:5px 0 15px">foodbok ♡</h2><button class="modal-close" onclick="closeModal()">×</button></div>${modal}</div></div>`:''}
function chooseSlot(slot){showModal(`<h3>Wybierz: ${lbl[slot]}</h3><p class="hint">Wybór zmieni jadłospis dla ${person?'mamy':'Klary'} w dniu ${date}.</p>${recipes().filter(r=>r.cat===slot).map(r=>`<div class="meal" style="grid-template-columns:1fr auto"><div><b>${esc(r.name)}</b><p class="hint">${fmt(r.macro[person][0])} kcal · B ${fmt(r.macro[person][1])} / W ${fmt(r.macro[person][2])} / T ${fmt(r.macro[person][3])}</p></div><button class="primary" onclick="setMeal('${slot}','${r.id}')">Wybierz</button></div>`).join('')}`)}
function details(id){let r=byId(id);showModal(`<h2>${esc(r.name)}</h2><div style="max-width:380px">${picture(r)}</div><p class="muted">${esc(r.desc)}</p><h3>Składniki — gramatura przed obróbką</h3><table class="ingredients"><thead><tr><th>Składnik</th><th>Klara</th><th>Mama</th></tr></thead><tbody>${r.ing.map(([name,a,b,unit])=>`<tr><td>${esc(name)}</td><td>${fmt(a)} ${esc(unit)}</td><td>${fmt(b)} ${esc(unit)}</td></tr>`).join('')}</tbody></table><h3>Makro na porcję</h3>${['Klara','Mama'].map((n,i)=>`<p><b>${n}:</b> ${fmt(r.macro[i][0])} kcal · B ${fmt(r.macro[i][1])} g · W ${fmt(r.macro[i][2])} g · T ${fmt(r.macro[i][3])} g</p>`).join('')}<p class="hint">Wartości szacunkowe — zależą od konkretnych produktów. W przypadku shake'ów jedna miarka odżywki wymaga przeliczenia na gramaturę przy zakupach.</p>${extras.some(x=>x.id===id)?`<button class="secondary" onclick="removeExtra('${id}')">Usuń ten dodany przepis</button>`:''}`)}
function showAdd(){showModal(`<h2>Nowy przepis 🍓</h2><form id="addform" onsubmit="addRecipe(event)"><label class="field">Nazwa posiłku<input name="name" required placeholder="Np. tortilla z kurczakiem"></label><label class="field" style="margin-top:12px">Kategoria<select name="cat">${['Śniadania','Lunch','Obiad','Kolacja','Smoothie'].map(c=>`<option>${c}</option>`).join('')}</select></label><label class="field" style="margin-top:12px">Opis<input name="desc" placeholder="Krótki opis"></label><label class="field" style="margin-top:12px">Składniki — każda linia: nazwa ; gramy Klara ; gramy Mama ; jednostka<textarea name="ings" required placeholder="Tortilla; 60; 50; g&#10;Kurczak; 150; 130; g"></textarea></label><p class="hint">Makro na jedną porcję wpisz oddzielnie dla każdej osoby, w kolejności: kcal, białko, węglowodany, tłuszcze.</p><div class="two">${['Klara','Mama'].map((name,i)=>`<div><b>${name}</b>${['kcal','białko g','węgle g','tłuszcz g'].map((m,j)=>`<label class="field" style="margin-top:8px">${m}<input name="m${i}${j}" type="number" step="0.1" min="0" required></label>`).join('')}</div>`).join('')}</div><button class="primary full" style="margin-top:18px">Zapisz przepis</button></form>`)}
function addRecipe(event){event.preventDefault();let data=new FormData(event.target);let ing=String(data.get('ings')).split('\n').filter(x=>x.trim()).map(line=>{let v=line.split(';').map(s=>s.trim());return[v[0],Number(v[1]),Number(v[2]),v[3]||'g']});if(ing.some(x=>!x[0]||!Number.isFinite(x[1])||!Number.isFinite(x[2]))){alert('Sprawdź składniki: użyj średników między nazwą, ilościami i jednostką.');return}let r={id:'extra_'+Date.now(),cat:data.get('cat'),name:data.get('name'),desc:data.get('desc')||'Własny przepis',photo:null,ing,macro:[0,1].map(i=>[0,1,2,3].map(j=>Number(data.get('m'+i+j))))};extras.push(r);save('fb_extra',extras);shopConfig.selected.push(r.id);save('fb_shop',shopConfig);closeModal();render();alert('Przepis dodany do Foodbok!')}
function removeExtra(id){if(!confirm('Usunąć własny przepis?'))return;extras=extras.filter(x=>x.id!==id);save('fb_extra',extras);shopConfig.selected=shopConfig.selected.filter(x=>x!==id);save('fb_shop',shopConfig);closeModal();render()}

// FOODBOk ↔ REDUKCJA: Transfer na żądanie, bez zewnętrznego serwera.
const REDUKCJA_URL='https://klarasile.github.io/Klara-Redukcja-/';
function foodbokGoal(day,p){
  const w=Math.floor((Date.parse(day+'T12:00:00Z')-Date.UTC(2026,10,9))/604800000)+1;
  if(p===0) return w>=9&&w<=12?1500:1700;
  return w>=10&&w<=12?1500:1600;
}
function sendToReduction(){
  const records=[];
  Object.entries(plans).forEach(([k,p])=>{
    const match=/^(\d{4}-\d{2}-\d{2})_([01])$/.exec(k);
    if(!match||!p||!p.eaten||!p.select)return;
    const personId=Number(match[2]);
    const total=[0,0,0,0];let count=0;
    slots.forEach(slot=>{
      if(!p.eaten[slot])return;
      const rec=byId(p.select[slot]);
      if(!rec||!Array.isArray(rec.macro?.[personId]))return;
      rec.macro[personId].forEach((v,i)=>{if(i<4)total[i]+=(Number(v)||0)});
      count++;
    });
    records.push([match[1],personId,...total.map(n=>Math.round(n*10)/10),count]);
  });
  if(records.length===0){alert('Nie ma jeszcze dni z zapisanymi posiłkami. W Foodbok zaznacz zjedzone posiłki, a potem spróbuj ponownie.');return}
  if(records.length>500){alert('Zbyt dużo rekordów do jednorazowego przesłania.');return}
  const payload={version:1,source:'foodbok',exportedAt:new Date().toISOString(),records};
  window.location.href=REDUKCJA_URL+'#foodbok='+encodeURIComponent(JSON.stringify(payload));
}
